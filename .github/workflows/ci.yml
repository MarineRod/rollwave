name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rendre le Maven Wrapper exécutable
        run: chmod +x mvnw

      - name: Compiler et lancer les tests
        run: ./mvnw -B clean verify

      - name: Conserver le .jar produit
        uses: actions/upload-artifact@v4
        with:
          name: rollwave-jar
          path: target/*.jar
          retention-days: 7

  deploy:
    name: Déploiement sur Render
    needs: build
    runs-on: ubuntu-latest
    # Uniquement après un push sur main (jamais pour une pull request)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Déclencher le déploiement Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"