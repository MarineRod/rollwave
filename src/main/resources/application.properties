spring.application.name=rollwave
spring.datasource.url=jdbc:h2:mem:skatedb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000
server.port=${PORT:8080}

# API de geocodage de la Geoplateforme (IGN), gratuite et sans cle
geocoding.url=https://data.geopf.fr/geocodage

# Fichier produit par l'outil de geocodage (profil geocode), a la racine du projet
geocoding.output-file=skateparks-geocoded.csv